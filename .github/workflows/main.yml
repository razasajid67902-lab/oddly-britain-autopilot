name: Oddly Britain Autopilot

on:
  workflow_dispatch:

jobs:
  create-content:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Oddly Britain content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          key = os.environ["GEMINI_API_KEY"]

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"

          prompt = """
          You are the content director for a YouTube channel called Oddly Britain.

          Channel niche:
          British weird history, strange mysteries, bizarre places,
          unusual British culture and unbelievable true stories.

          Create ONE original YouTube video for a UK audience.

          Length: 6-10 minutes.

          Choose an interesting topic that is not extremely overused.

          The video must be:
          - original
          - entertaining
          - factual in tone
          - conversational British English
          - suitable for monetization
          - not copied from another creator
          - not repetitive

          Return exactly:

          TITLE:
          HOOK:
          DESCRIPTION:
          TAGS:
          SCRIPT:

          The script should have:
          1. A powerful opening hook.
          2. Strong curiosity throughout.
          3. Storytelling.
          4. Interesting details.
          5. A satisfying ending.

          Do not knowingly invent facts.
          If something is uncertain, clearly say it is uncertain.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 12000
              }
          }

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": key
          }

          last_error = None

          for attempt in range(1, 6):
              try:
                  print(f"Gemini attempt {attempt}/5...")

                  req = urllib.request.Request(
                      url,
                      data=json.dumps(data).encode("utf-8"),
                      headers=headers,
                      method="POST"
                  )

                  with urllib.request.urlopen(req, timeout=120) as response:
                      result = json.load(response)

                  text = result["candidates"][0]["content"]["parts"][0]["text"]

                  os.makedirs("output", exist_ok=True)

                  with open(
                      "output/content.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(text)

                  print("SUCCESS: Content generated.")
                  print(text)

                  break

              except urllib.error.HTTPError as e:
                  last_error = e
                  print(f"Gemini HTTP error: {e.code}")

                  if e.code in [429, 500, 502, 503, 504]:
                      if attempt < 5:
                          wait = attempt * 10
                          print(f"Temporary error. Waiting {wait} seconds...")
                          time.sleep(wait)
                          continue

                  raise

              except Exception as e:
                  last_error = e
                  print(f"Temporary error: {e}")

                  if attempt < 5:
                      wait = attempt * 10
                      print(f"Retrying in {wait} seconds...")
                      time.sleep(wait)
                  else:
                      raise

          else:
              raise last_error

          PY

      - name: Save generated content
        uses: actions/upload-artifact@v4
        with:
          name: oddly-britain-content
          path: output/content.txt
