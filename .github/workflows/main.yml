name: Oddly Britain Autopilot

on:
  workflow_dispatch:

jobs:
  create-video-assets:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. GENERATE SCRIPT
      # =========================

      - name: Generate Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import random
          import urllib.request
          import urllib.error

          KEY = os.environ["GEMINI_API_KEY"]

          models = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-2.5-flash"
          ]

          prompt = """
          You are the content director for a YouTube channel called Oddly Britain.

          NICHE:
          British weird history, strange mysteries, bizarre places,
          unusual British culture and unbelievable true stories.

          Create ONE original YouTube video for a UK audience.

          Target length: 6-10 minutes.

          Choose an intriguing topic that is not extremely overused.

          The video must be:
          - original
          - entertaining
          - factual in tone
          - conversational British English
          - suitable for monetization
          - not copied from another creator
          - not repetitive

          Return exactly these sections:

          TITLE:
          HOOK:
          DESCRIPTION:
          TAGS:
          SCRIPT:

          The SCRIPT must be a complete narration suitable for a 6-10 minute
          documentary-style YouTube video.

          Start with a powerful hook.
          Maintain curiosity.
          Use storytelling.
          Include interesting details.
          End with a satisfying conclusion.

          Do not knowingly invent facts.
          If something is uncertain, clearly say so.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 8000
              }
          }

          success = False

          for model in models:

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/" + model + ":generateContent"
              )

              print("Trying model:", model)

              for attempt in range(1, 5):

                  try:

                      req = urllib.request.Request(
                          url,
                          data=json.dumps(data).encode("utf-8"),
                          headers={
                              "Content-Type": "application/json",
                              "x-goog-api-key": KEY
                          },
                          method="POST"
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=180
                      ) as response:

                          result = json.load(response)

                      text = (
                          result["candidates"][0]
                          ["content"]["parts"][0]["text"]
                      )

                      if len(text.strip()) < 500:
                          raise Exception("Generated response is too short.")

                      os.makedirs("output", exist_ok=True)

                      with open(
                          "output/content.txt",
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(text)

                      print("SCRIPT SUCCESS using", model)

                      success = True
                      break

                  except urllib.error.HTTPError as e:

                      print(
                          "HTTP error",
                          e.code,
                          "on",
                          model,
                          "attempt",
                          attempt
                      )

                      if e.code not in [408, 429, 500, 502, 503, 504]:
                          break

                      if attempt < 4:
                          wait = (2 ** attempt) + random.uniform(0, 3)
                          print("Waiting", round(wait, 1), "seconds...")
                          time.sleep(wait)

                  except Exception as e:

                      print("Error:", e)

                      if attempt < 4:
                          wait = (2 ** attempt) + random.uniform(0, 3)
                          time.sleep(wait)

              if success:
                  break

          if not success:
              raise Exception(
                  "All Gemini script models failed after retries."
              )

          PY


      # =========================
      # 2. GENERATE VOICE
      # =========================

      - name: Generate British Voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import random
          import base64
          import urllib.request
          import urllib.error

          KEY = os.environ["GEMINI_API_KEY"]

          with open(
              "output/content.txt",
              "r",
              encoding="utf-8"
          ) as f:
              content = f.read()

          if "SCRIPT:" in content:
              script = content.split("SCRIPT:", 1)[1].strip()
          else:
              script = content

          if not script:
              raise Exception("SCRIPT is empty.")

          # Current Gemini TTS models.
          tts_models = [
              "gemini-3.8-flash-lite-tts",
              "gemini-3.8-flash-tts"
          ]

          data = {
              "input": [
                  {
                      "type": "user_input",
                      "content": [
                          {
                              "type": "text",
                              "text": script,
                              "annotations": [
                                  {
                                      "type": "speech_metadata",
                                      "style": (
                                          "Natural British English documentary "
                                          "narrator. Warm, confident, mysterious "
                                          "and engaging. Clear pronunciation, "
                                          "natural pacing and expressive delivery."
                                      )
                                  }
                              ]
                          }
                      ]
                  }
              ],
              "response_format": {
                  "type": "audio"
              },
              "generation_config": {
                  "speech_config": [
                      {
                          "voice": "Kore"
                      }
                  ]
              }
          }

          success = False

          for model in tts_models:

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/interactions"
              )

              payload = dict(data)
              payload["model"] = model

              print("Trying TTS model:", model)

              for attempt in range(1, 5):

                  try:

                      req = urllib.request.Request(
                          url,
                          data=json.dumps(payload).encode("utf-8"),
                          headers={
                              "Content-Type": "application/json",
                              "x-goog-api-key": KEY
                          },
                          method="POST"
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=300
                      ) as response:

                          result = json.load(response)

                      audio_data = None

                      # Current Interactions API stores audio
                      # inside model_output steps.
                      for step in result.get("steps", []):
                          if step.get("type") == "model_output":

                              for item in step.get("content", []):

                                  if item.get("type") == "audio":
                                      audio_data = item.get("data")

                      # Also support convenience-style response.
                      if not audio_data:
                          output_audio = result.get("output_audio")

                          if output_audio:
                              audio_data = output_audio.get("data")

                      if not audio_data:
                          raise Exception(
                              "No audio data returned by Gemini."
                          )

                      audio = base64.b64decode(audio_data)

                      os.makedirs("output", exist_ok=True)

                      with open(
                          "output/voice.wav",
                          "wb"
                      ) as f:
                          f.write(audio)

                      print(
                          "VOICE SUCCESS using",
                          model
                      )

                      print(
                          "Audio bytes:",
                          len(audio)
                      )

                      success = True
                      break

                  except urllib.error.HTTPError as e:

                      print(
                          "TTS HTTP error",
                          e.code,
                          "on",
                          model,
                          "attempt",
                          attempt
                      )

                      if e.code not in [408, 429, 500, 502, 503, 504]:
                          break

                      if attempt < 4:
                          wait = (2 ** attempt) + random.uniform(0, 3)
                          print(
                              "Waiting",
                              round(wait, 1),
                              "seconds..."
                          )
                          time.sleep(wait)

                  except Exception as e:

                      print("TTS error:", e)

                      if attempt < 4:
                          wait = (2 ** attempt) + random.uniform(0, 3)
                          time.sleep(wait)

              if success:
                  break

          if not success:
              raise Exception(
                  "All Gemini TTS models failed after retries."
              )

          PY


      # =========================
      # 3. SAVE FILES
      # =========================

      - name: Save Video Assets
        uses: actions/upload-artifact@v4
        with:
          name: oddly-britain-video-assets
          path: output/
