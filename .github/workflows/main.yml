name: Oddly Britain Autopilot

on:
  workflow_dispatch:

jobs:
  create-video-assets:
    runs-on: ubuntu-latest

    steps:

      - name: Generate Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          key = os.environ["GEMINI_API_KEY"]

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"

          prompt = """
          You are the content director for a YouTube channel called Oddly Britain.

          Niche:
          British weird history, strange mysteries, bizarre places,
          unusual British culture and unbelievable true stories.

          Create ONE original 6-10 minute YouTube video for a UK audience.

          Choose an intriguing topic that is not extremely overused.

          Make it:
          - original
          - entertaining
          - factual in tone
          - conversational British English
          - suitable for monetization
          - not copied
          - not repetitive

          Return exactly:

          TITLE:
          HOOK:
          DESCRIPTION:
          TAGS:
          SCRIPT:

          SCRIPT must be a complete narration suitable for a 6-10 minute video.

          Start with a powerful hook.
          Maintain curiosity throughout.
          Use storytelling and interesting details.
          End with a satisfying conclusion.

          Do not knowingly invent facts.
          If something is uncertain, clearly say so.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {"text": prompt}
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 12000
              }
          }

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": key
          }

          for attempt in range(1, 6):
              try:
                  print(f"Script attempt {attempt}/5")

                  req = urllib.request.Request(
                      url,
                      data=json.dumps(data).encode("utf-8"),
                      headers=headers,
                      method="POST"
                  )

                  with urllib.request.urlopen(req, timeout=180) as response:
                      result = json.load(response)

                  text = result["candidates"][0]["content"]["parts"][0]["text"]

                  os.makedirs("output", exist_ok=True)

                  with open("output/content.txt", "w", encoding="utf-8") as f:
                      f.write(text)

                  print("SCRIPT GENERATED SUCCESSFULLY")
                  break

              except Exception as e:
                  print("Error:", e)

                  if attempt == 5:
                      raise

                  time.sleep(attempt * 10)

          PY


      - name: Generate British Voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import base64
          import urllib.request
          import urllib.error

          key = os.environ["GEMINI_API_KEY"]

          with open("output/content.txt", "r", encoding="utf-8") as f:
              content = f.read()

          if "SCRIPT:" in content:
              script = content.split("SCRIPT:", 1)[1].strip()
          else:
              script = content

          # Keep only the actual narration
          if not script:
              raise Exception("No script found")

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-tts:generateContent"

          data = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": script,
                              "speech_metadata": {
                                  "style": "Natural British English documentary narrator. Warm, confident, mysterious, conversational, expressive and engaging. Clear pronunciation with varied pacing. Build suspense during mysterious moments."
                              }
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "responseModalities": ["AUDIO"],
                  "speechConfig": {
                      "voiceConfig": {
                          "voice": "Kore"
                      }
                  }
              }
          }

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": key
          }

          for attempt in range(1, 6):
              try:
                  print(f"TTS attempt {attempt}/5")

                  req = urllib.request.Request(
                      url,
                      data=json.dumps(data).encode("utf-8"),
                      headers=headers,
                      method="POST"
                  )

                  with urllib.request.urlopen(req, timeout=300) as response:
                      result = json.load(response)

                  audio_b64 = (
                      result["candidates"][0]
                      ["content"]["parts"][0]
                      ["inlineData"]["data"]
                  )

                  audio = base64.b64decode(audio_b64)

                  with open("output/voice.wav", "wb") as f:
                      f.write(audio)

                  print("BRITISH VOICE GENERATED SUCCESSFULLY")
                  print(f"Audio size: {len(audio)} bytes")
                  break

              except Exception as e:
                  print("TTS Error:", e)

                  if attempt == 5:
                      raise

                  time.sleep(attempt * 10)

          PY


      - name: Save Video Assets
        uses: actions/upload-artifact@v4
        with:
          name: oddly-britain-video-assets
          path: output/
