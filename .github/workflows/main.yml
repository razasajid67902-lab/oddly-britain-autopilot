name: Oddly Britain Autopilot

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. INSTALL TOOLS
      # ============================================================

      - name: Install FFmpeg and ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg imagemagick python3-pil


      # ============================================================
      # 2. GENERATE STORY + VISUAL PLAN
      # ============================================================

      - name: Generate Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          set -e

          mkdir -p output
          mkdir -p output/images
          mkdir -p output/scenes

          python3 - <<'PY'
          import os
          import json
          import time
          import random
          import urllib.request
          import urllib.error

          KEY = os.environ["GEMINI_API_KEY"]

          models = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-2.5-flash"
          ]

          prompt = r"""
          You are the senior content director for a serious YouTube channel
          called ODDLY BRITAIN.

          CHANNEL:
          British weird history, strange mysteries, bizarre places,
          unusual British culture, forgotten events and unbelievable
          TRUE stories.

          AUDIENCE:
          Mainly UK, then USA and worldwide English-speaking viewers.

          IMPORTANT:
          We do NOT want a slideshow.
          We want a cinematic documentary-style YouTube video.

          Choose ONE strong topic.

          The topic should have:
          - a powerful mystery or surprising fact
          - a strong visual history
          - enough real historical/location imagery
          - a satisfying reveal/payoff
          - genuine entertainment value

          Avoid extremely generic topics.

          The narration should be approximately 7-10 minutes.

          Write in natural British English.

          Do not knowingly invent facts.
          If a detail is uncertain, say so in the narration.

          Return EXACTLY these sections:

          TITLE:
          DESCRIPTION:
          TAGS:
          HOOK:
          SCRIPT:

          VISUALS:

          Under VISUALS create EXACTLY 24 lines.

          Format every line:

          01 | SEARCH QUERY | SCENE PURPOSE
          02 | SEARCH QUERY | SCENE PURPOSE

          Continue until 24.

          Each SEARCH QUERY must describe a real visual that could
          reasonably be found in Wikimedia Commons.

          Prefer:
          - historical photographs
          - paintings
          - old maps
          - buildings
          - streets
          - landscapes
          - newspaper illustrations
          - historical people when relevant
          - documents
          - objects
          - locations

          Do NOT make visual queries such as:
          "scary AI image"
          "cinematic mysterious man"
          "fantasy castle"

          We need REAL or historically documented visuals.

          The video should feel like a real documentary.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.75,
                  "maxOutputTokens": 12000
              }
          }

          success = False

          for model in models:

              print("Trying:", model)

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/" +
                  model +
                  ":generateContent"
              )

              for attempt in range(1, 5):

                  try:

                      req = urllib.request.Request(
                          url,
                          data=json.dumps(data).encode("utf-8"),
                          headers={
                              "Content-Type": "application/json",
                              "x-goog-api-key": KEY
                          },
                          method="POST"
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=240
                      ) as response:

                          result = json.load(response)

                      text = (
                          result["candidates"][0]
                          ["content"]["parts"][0]["text"]
                      )

                      if len(text) < 2000:
                          raise Exception(
                              "Generated content too short."
                          )

                      with open(
                          "output/content.txt",
                          "w",
                          encoding="utf-8"
                      ) as f:

                          f.write(text)

                      print("STORY GENERATED")
                      print("MODEL:", model)

                      success = True
                      break

                  except urllib.error.HTTPError as e:

                      print(
                          "HTTP ERROR",
                          e.code,
                          "attempt",
                          attempt
                      )

                      if e.code not in [
                          408, 429, 500, 502, 503, 504
                      ]:
                          break

                      if attempt < 4:
                          time.sleep(
                              (2 ** attempt) +
                              random.uniform(0, 3)
                          )

                  except Exception as e:

                      print("ERROR:", e)

                      if attempt < 4:
                          time.sleep(
                              (2 ** attempt) +
                              random.uniform(0, 3)
                          )

              if success:
                  break

          if not success:
              raise Exception(
                  "Gemini failed to generate the story."
              )

          PY


      # ============================================================
      # 3. GENERATE VOICE
      # ============================================================

      - name: Generate Voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          set -e

          python3 - <<'PY'
          import os
          import json
          import time
          import random
          import base64
          import urllib.request
          import urllib.error

          KEY = os.environ["GEMINI_API_KEY"]

          with open(
              "output/content.txt",
              "r",
              encoding="utf-8"
          ) as f:

              content = f.read()

          if "SCRIPT:" not in content:
              raise Exception("SCRIPT section missing.")

          script = content.split(
              "SCRIPT:",
              1
          )[1]

          if "VISUALS:" in script:
              script = script.split(
                  "VISUALS:",
                  1
              )[0]

          script = script.strip()

          if len(script) < 1000:
              raise Exception(
                  "Narration script too short."
              )

          models = [
              "gemini-3.8-flash-lite-tts",
              "gemini-3.8-flash-tts"
          ]

          payload_base = {

              "input": [
                  {
                      "type": "user_input",
                      "content": [
                          {
                              "type": "text",
                              "text": script,

                              "annotations": [
                                  {
                                      "type": "speech_metadata",
                                      "style":
                                      "Natural British English documentary "
                                      "narrator. Warm, intelligent, confident, "
                                      "slightly mysterious and expressive. "
                                      "Use natural pacing and pauses. "
                                      "Sound like a professional UK documentary "
                                      "presenter, not a robotic AI voice."
                                  }
                              ]
                          }
                      ]
                  }
              ],

              "response_format": {
                  "type": "audio"
              },

              "generation_config": {
                  "speech_config": [
                      {
                          "voice": "Kore"
                      }
                  ]
              }
          }

          success = False

          for model in models:

              payload = dict(payload_base)
              payload["model"] = model

              print(
                  "Trying TTS:",
                  model
              )

              for attempt in range(1, 5):

                  try:

                      req = urllib.request.Request(
                          "https://generativelanguage.googleapis.com/"
                          "v1beta/interactions",

                          data=json.dumps(
                              payload
                          ).encode("utf-8"),

                          headers={
                              "Content-Type": "application/json",
                              "x-goog-api-key": KEY
                          },

                          method="POST"
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=300
                      ) as response:

                          result = json.load(response)

                      audio_data = None

                      for step in result.get(
                          "steps",
                          []
                      ):

                          if step.get(
                              "type"
                          ) == "model_output":

                              for item in step.get(
                                  "content",
                                  []
                              ):

                                  if item.get(
                                      "type"
                                  ) == "audio":

                                      audio_data = item.get(
                                          "data"
                                      )

                      if not audio_data:

                          output_audio = result.get(
                              "output_audio"
                          )

                          if output_audio:
                              audio_data = (
                                  output_audio.get(
                                      "data"
                                  )
                              )

                      if not audio_data:
                          raise Exception(
                              "No audio returned."
                          )

                      audio = base64.b64decode(
                          audio_data
                      )

                      with open(
                          "output/voice.wav",
                          "wb"
                      ) as f:

                          f.write(audio)

                      if len(audio) < 1000:
                          raise Exception(
                              "Audio too small."
                          )

                      print(
                          "VOICE CREATED:",
                          len(audio),
                          "bytes"
                      )

                      success = True
                      break

                  except urllib.error.HTTPError as e:

                      print(
                          "TTS HTTP",
                          e.code
                      )

                      if e.code not in [
                          408, 429, 500, 502, 503, 504
                      ]:
                          break

                      if attempt < 4:
                          time.sleep(
                              (2 ** attempt) +
                              random.uniform(0, 3)
                          )

                  except Exception as e:

                      print("TTS ERROR:", e)

                      if attempt < 4:
                          time.sleep(
                              (2 ** attempt) +
                              random.uniform(0, 3)
                          )

              if success:
                  break

          if not success:
              raise Exception(
                  "All TTS models failed."
              )

          PY


      # ============================================================
      # 4. EXTRACT VISUAL QUERIES
      # ============================================================

      - name: Extract Visual Plan
        run: |
          set -e

          python3 - <<'PY'

          import re

          with open(
              "output/content.txt",
              "r",
              encoding="utf-8"
          ) as f:

              text = f.read()

          if "VISUALS:" not in text:
              raise Exception(
                  "VISUALS section missing."
              )

          section = text.split(
              "VISUALS:",
              1
          )[1]

          lines = []

          for line in section.splitlines():

              match = re.match(
                  r'^\s*(\d{1,2})\s*\|\s*(.*?)\s*\|\s*(.*?)\s*$',
                  line
              )

              if match:

                  number = int(
                      match.group(1)
                  )

                  query = match.group(2).strip()
                  purpose = match.group(3).strip()

                  lines.append(
                      (
                          number,
                          query,
                          purpose
                      )
                  )

          if len(lines) < 15:
              raise Exception(
                  "Too few visual queries."
              )

          lines = sorted(
              lines,
              key=lambda x: x[0]
          )

          with open(
              "output/visual_plan.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for number, query, purpose in lines:

                  f.write(
                      f"{number:02d}|{query}|{purpose}\n"
                  )

          print(
              "VISUALS FOUND:",
              len(lines)
          )

          PY


      # ============================================================
      # 5. DOWNLOAD REAL WIKIMEDIA VISUALS
      # ============================================================

      - name: Download Real Visuals
        run: |
          set -e

          python3 - <<'PY'

          import os
          import urllib.parse
          import urllib.request
          import json
          import time

          os.makedirs(
              "output/images",
              exist_ok=True
          )

          USER_AGENT = (
              "OddlyBritainAutopilot/1.0 "
              "(YouTube documentary project)"
          )

          with open(
              "output/visual_plan.txt",
              "r",
              encoding="utf-8"
          ) as f:

              rows = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]

          downloaded = 0

          for row in rows:

              number, query, purpose = row.split(
                  "|",
                  2
              )

              print(
                  "\nSearching:",
                  number,
                  query
              )

              params = {
                  "action": "query",
                  "format": "json",
                  "generator": "search",
                  "gsrsearch": query,
                  "gsrnamespace": "6",
                  "gsrlimit": "8",
                  "prop": "imageinfo",
                  "iiprop": "url|mime|size|extmetadata",
                  "iiurlwidth": "1400"
              }

              url = (
                  "https://commons.wikimedia.org/w/api.php?"
                  +
                  urllib.parse.urlencode(
                      params
                  )
              )

              try:

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": USER_AGENT
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      data = json.load(response)

                  pages = data.get(
                      "query",
                      {}
                  ).get(
                      "pages",
                      {}
                  )

                  selected = None

                  for page in pages.values():

                      info = page.get(
                          "imageinfo",
                          []
                      )

                      if not info:
                          continue

                      item = info[0]

                      mime = item.get(
                          "mime",
                          ""
                      )

                      if not mime.startswith(
                          "image/"
                      ):
                          continue

                      image_url = (
                          item.get(
                              "thumburl"
                          )
                          or
                          item.get(
                              "url"
                          )
                      )

                      if not image_url:
                          continue

                      selected = (
                          page,
                          item
                      )

                      break

                  if not selected:

                      print(
                          "No image found for",
                          number
                      )

                      continue

                  page, item = selected

                  image_url = (
                      item.get(
                          "thumburl"
                      )
                      or
                      item.get(
                          "url"
                      )
                  )

                  extension = ".jpg"

                  mime = item.get(
                      "mime",
                      ""
                  )

                  if "png" in mime:
                      extension = ".png"

                  filename = (
                      f"output/images/"
                      f"scene_{int(number):02d}"
                      f"{extension}"
                  )

                  request = urllib.request.Request(
                      image_url,
                      headers={
                          "User-Agent": USER_AGENT
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      image_data = response.read()

                  if len(image_data) < 5000:

                      print(
                          "Image too small."
                      )

                      continue

                  with open(
                      filename,
                      "wb"
                  ) as f:

                      f.write(image_data)

                  downloaded += 1

                  print(
                      "Downloaded:",
                      filename
                  )

                  time.sleep(0.4)

              except Exception as e:

                  print(
                      "VISUAL ERROR:",
                      e
                  )

          print(
              "\nTOTAL VISUALS:",
              downloaded
          )

          if downloaded < 8:

              raise Exception(
                  "Too few real visuals were downloaded."
              )

          PY


      # ============================================================
      # 6. NORMALIZE IMAGES
      # ============================================================

      - name: Prepare Images
        run: |
          set -e

          mkdir -p output/clean

          for FILE in output/images/*
          do

            if [ -f "$FILE" ]; then

              BASE=$(basename "$FILE")
              NAME="${BASE%.*}"

              echo "Preparing $BASE"

              ffmpeg \
                -y \
                -hide_banner \
                -loglevel error \
                -i "$FILE" \
                -vf "
                  scale=1400:2500:
                  force_original_aspect_ratio=increase,
                  crop=1400:2500,
                  setsar=1
                " \
                -frames:v 1 \
                "output/clean/${NAME}.jpg"

            fi

          done

          COUNT=$(find output/clean \
            -name '*.jpg' | wc -l)

          echo "Prepared images:"
          echo "$COUNT"

          if [ "$COUNT" -lt 8 ]; then
            echo "Not enough prepared images."
            exit 1
          fi


      # ============================================================
      # 7. CREATE SCENE LIST
      # ============================================================

      - name: Create Scene Plan
        run: |
          set -e

          python3 - <<'PY'

          import os
          import glob
          import re

          files = sorted(
              glob.glob(
                  "output/clean/*.jpg"
              )
          )

          rows = []

          for file in files:

              name = os.path.basename(
                  file
              )

              match = re.search(
                  r'scene_(\d+)',
                  name
              )

              if match:

                  number = int(
                      match.group(1)
                  )

                  rows.append(
                      (
                          number,
                          file
                      )
                  )

          rows.sort()

          with open(
              "output/scenes.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for number, file in rows:

                  f.write(
                      f"{number}|{file}\n"
                  )

          print(
              "Scenes:",
              len(rows)
          )

          PY


      # ============================================================
      # 8. BUILD CINEMATIC VISUAL VIDEO
      # ============================================================

      - name: Build Cinematic Video
        run: |
          set -e

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/voice.wav)

          SCENE_COUNT=$(cat \
            output/scenes.txt | wc -l)

          SCENE_DURATION=$(python3 \
            - "$AUDIO_DURATION" \
            "$SCENE_COUNT" <<'PY'
          import sys

          duration = float(
              sys.argv[1]
          )

          count = int(
              sys.argv[2]
          )

          print(
              max(
                  8.0,
                  duration / max(count, 1)
              )
          )

          PY
          )

          echo "Audio:"
          echo "$AUDIO_DURATION"

          echo "Scenes:"
          echo "$SCENE_COUNT"

          echo "Scene duration:"
          echo "$SCENE_DURATION"

          rm -f output/concat.txt

          INDEX=0

          while IFS='|' read -r NUMBER FILE
          do

            INDEX=$((INDEX + 1))

            OUT="output/scenes/scene_${INDEX}.mp4"

            echo ""
            echo "================================"
            echo "Rendering scene $INDEX"
            echo "================================"

            if [ $((INDEX % 2)) -eq 0 ]; then

              ZOOM="
                zoompan=
                z='min(zoom+0.0008,1.15)':
                x='iw/2-(iw/zoom/2)':
                y='ih/2-(ih/zoom/2)':
                d=1:
                s=1080x1920:
                fps=30
              "

            else

              ZOOM="
                zoompan=
                z='min(zoom+0.0008,1.15)':
                x='(iw-iw/zoom)*on/(720*30)':
                y='(ih-ih/zoom)*0.5':
                d=1:
                s=1080x1920:
                fps=30
              "

            fi

            ffmpeg \
              -y \
              -hide_banner \
              -loglevel error \
              -loop 1 \
              -i "$FILE" \
              -t "$SCENE_DURATION" \
              -vf "$ZOOM" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              "$OUT"

            printf "file '%s'\n" \
              "$PWD/$OUT" \
              >> output/concat.txt

          done < output/scenes.txt

          echo "Joining cinematic scenes..."

          ffmpeg \
            -y \
            -hide_banner \
            -loglevel error \
            -f concat \
            -safe 0 \
            -i output/concat.txt \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            output/visual_video.mp4


      # ============================================================
      # 9. ADD NARRATION
      # ============================================================

      - name: Add Narration
        run: |
          set -e

          ffmpeg \
            -y \
            -hide_banner \
            -loglevel error \
            -i output/visual_video.mp4 \
            -i output/voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/oddly_britain_video.mp4

          echo ""
          echo "FINAL VIDEO:"
          
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/oddly_britain_video.mp4


      # ============================================================
      # 10. CREATE THUMBNAIL
      # ============================================================

      - name: Create Thumbnail
        run: |
          set -e

          FIRST_IMAGE=$(find \
            output/clean \
            -name '*.jpg' \
            | sort \
            | head -n 1)

          if [ -z "$FIRST_IMAGE" ]; then
            echo "No thumbnail image found."
            exit 1
          fi

          ffmpeg \
            -y \
            -hide_banner \
            -loglevel error \
            -i "$FIRST_IMAGE" \
            -vf "
              scale=1280:720:
              force_original_aspect_ratio=increase,
              crop=1280:720,
              eq=contrast=1.08:saturation=1.12
            " \
            -frames:v 1 \
            output/thumbnail.jpg

          echo "Thumbnail created."


      # ============================================================
      # 11. EXTRACT TITLE / DESCRIPTION / TAGS
      # ============================================================

      - name: Create YouTube Metadata
        run: |
          set -e

          python3 - <<'PY'

          import re

          with open(
              "output/content.txt",
              "r",
              encoding="utf-8"
          ) as f:

              text = f.read()

          def get_section(
              name,
              next_name
          ):

              pattern = (
                  re.escape(name)
                  +
                  r'\s*(.*?)'
                  +
                  re.escape(next_name)
              )

              match = re.search(
                  pattern,
                  text,
                  re.S |
                  re.I
              )

              if match:
                  return match.group(1).strip()

              return ""

          title = get_section(
              "TITLE:",
              "DESCRIPTION:"
          )

          description = get_section(
              "DESCRIPTION:",
              "TAGS:"
          )

          tags = get_section(
              "TAGS:",
              "HOOK:"
          )

          if not title:
              title = "Oddly Britain"

          with open(
              "output/youtube_title.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  title[:100]
              )

          with open(
              "output/youtube_description.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  description
              )

          with open(
              "output/youtube_tags.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  tags
              )

          print(
              "TITLE:",
              title
          )

          PY


      # ============================================================
      # 12. SAVE FINAL ARTIFACT
      # ============================================================

      - name: Save Final Video Package
        uses: actions/upload-artifact@v4
        with:
          name: oddly-britain-final-video
          path: output/
